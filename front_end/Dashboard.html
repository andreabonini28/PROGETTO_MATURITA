<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Ride Together</title>
  <link rel="stylesheet" href="globalCSS.css">
</head>
<body>

  <div class="page-card">

    <header class="dash-header">
      <div class="dash-greeting">
        <p class="dash-hello">Ciao, Timber Lucco 👋</p>
        <p class="dash-sub">Dove vuoi andare oggi?</p>
      </div>
      <a href="profilo.html" class="dash-avatar" aria-label="Vai al profilo">
        <svg viewBox="0 0 48 48" width="28" height="28" fill="none" stroke="#1e6650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="24" cy="8" r="4" fill="#a8ddb5" stroke="#1e6650"/>
          <path d="M18 16 Q24 13 30 16 L30 22 L18 22 Z"/>
          <path d="M8 36 C8 36 10 30 13 29 L16 24 H32 L35 29 C38 30 40 33 40 36 V38 H8 Z"/>
          <circle cx="15" cy="38" r="3"/>
          <circle cx="33" cy="38" r="3"/>
          <path d="M16 29 L18 24 H30 L32 29 Z"/>
        </svg>
      </a>
    </header>

    <div class="dash-search">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" placeholder="Cerca una destinazione..." class="search-input">
    </div>

    <section class="dash-section">
      <h2 class="dash-section-title">Azioni rapide</h2>
      <div class="quick-grid">
        <button class="quick-card">
          <div class="quick-icon"><i class="ti ti-plus" aria-hidden="true"></i></div>
          <span class="quick-label">Offri un viaggio</span>
        </button>
        <button class="quick-card">
          <div class="quick-icon"><i class="ti ti-search" aria-hidden="true"></i></div>
          <span class="quick-label">Cerca un viaggio</span>
        </button>
        <button class="quick-card">
          <div class="quick-icon"><i class="ti ti-map-pin" aria-hidden="true"></i></div>
          <span class="quick-label">Mappa in tempo reale</span>
        </button>
        <button class="quick-card">
          <div class="quick-icon"><i class="ti ti-clock" aria-hidden="true"></i></div>
          <span class="quick-label">Storico viaggi</span>
        </button>
      </div>
    </section>

    <section class="dash-section">
      <h2 class="dash-section-title">Prossimi viaggi</h2>
      <div class="ride-list">
        <div class="ride-card">
          <div class="ride-dot ride-dot--active"></div>
          <div class="ride-info">
            <p class="ride-route">Milano → Roma</p>
            <p class="ride-meta">Domani, 08:30 · 3 posti</p>
            <span class="ride-badge">Confermato</span>
          </div>
          <i class="ti ti-chevron-right ride-arrow" aria-hidden="true"></i>
        </div>
        <div class="ride-card">
          <div class="ride-dot"></div>
          <div class="ride-info">
            <p class="ride-route">Torino → Genova</p>
            <p class="ride-meta">Ven 16 mag, 14:00 · 2 posti</p>
            <span class="ride-badge ride-badge--pending">In attesa</span>
          </div>
          <i class="ti ti-chevron-right ride-arrow" aria-hidden="true"></i>
        </div>
        <div class="ride-card">
          <div class="ride-dot"></div>
          <div class="ride-info">
            <p class="ride-route">Bologna → Firenze</p>
            <p class="ride-meta">Sab 17 mag, 09:00 · 1 posto</p>
            <span class="ride-badge ride-badge--pending">In attesa</span>
          </div>
          <i class="ti ti-chevron-right ride-arrow" aria-hidden="true"></i>
        </div>
      </div>
    </section>

  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active" aria-label="Home">
      <i class="ti ti-home"></i>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item" aria-label="Viaggi">
      <i class="ti ti-car"></i>
      <span>Viaggi</span>
    </a>
    <a href="#" class="nav-item" aria-label="Messaggi">
      <i class="ti ti-message"></i>
      <span>Messaggi</span>
    </a>
    <a href="profilo.html" class="nav-item" aria-label="Profilo">
      <i class="ti ti-user"></i>
      <span>Profilo</span>
    </a>
  </nav>

</body>
</html>
