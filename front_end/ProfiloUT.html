<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo – Ride Together</title>
  <link rel="stylesheet" href="globalCSS.css">
</head>
<body>

  <div class="page-card">

    <header class="prof-header">
      <div class="prof-avatar-wrap">
        <div class="prof-avatar">
          <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="#1e6650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- testa -->
            <circle cx="24" cy="8" r="4" fill="#a8ddb5" stroke="#1e6650"/>
            <!-- busto -->
            <path d="M18 16 Q24 13 30 16 L30 22 L18 22 Z"/>
            <!-- macchina -->
            <path d="M8 36 C8 36 10 30 13 29 L16 24 H32 L35 29 C38 30 40 33 40 36 V38 H8 Z"/>
            <circle cx="15" cy="38" r="3"/>
            <circle cx="33" cy="38" r="3"/>
            <path d="M16 29 L18 24 H30 L32 29 Z"/>
          </svg>
        </div>
        <button class="prof-edit-btn" aria-label="Modifica foto profilo">
          <i class="ti ti-edit" aria-hidden="true"></i>
        </button>
      </div>
      <h1 class="prof-name">Timber Lucco</h1>
      <p class="prof-since">Membro da gennaio 2024</p>
    </header>

    <div class="prof-stats">
      <div class="stat-item">
        <span class="stat-num">24</span>
        <span class="stat-lbl">Viaggi</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num">1.240</span>
        <span class="stat-lbl">Km</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num">4.8 ★</span>
        <span class="stat-lbl">Valutazione</span>
      </div>
    </div>

    <section class="prof-section">
      <h2 class="prof-section-title">Informazioni personali</h2>
      <div class="info-card">
        <div class="info-row">
          <i class="ti ti-user" aria-hidden="true"></i>
          <div class="info-text">
            <span class="info-label">Nome</span>
            <span class="info-value">Timber Lucco</span>
          </div>
          <i class="ti ti-chevron-right info-arrow" aria-hidden="true"></i>
        </div>
        <div class="info-row">
          <i class="ti ti-mail" aria-hidden="true"></i>
          <div class="info-text">
            <span class="info-label">Email</span>
            <span class="info-value">timber.lucco@email.com</span>
          </div>
          <i class="ti ti-chevron-right info-arrow" aria-hidden="true"></i>
        </div>
        <div class="info-row">
          <i class="ti ti-phone" aria-hidden="true"></i>
          <div class="info-text">
            <span class="info-label">Telefono</span>
            <span class="info-value">+39 333 456 7890</span>
          </div>
          <i class="ti ti-chevron-right info-arrow" aria-hidden="true"></i>
        </div>
      </div>
    </section>

    <section class="prof-section">
      <h2 class="prof-section-title">Impostazioni</h2>
      <div class="info-card">
        <div class="info-row">
          <i class="ti ti-bell" aria-hidden="true"></i>
          <div class="info-text">
            <span class="info-value">Notifiche</span>
          </div>
          <i class="ti ti-chevron-right info-arrow" aria-hidden="true"></i>
        </div>
        <div class="info-row">
          <i class="ti ti-lock" aria-hidden="true"></i>
          <div class="info-text">
            <span class="info-value">Privacy e sicurezza</span>
          </div>
          <i class="ti ti-chevron-right info-arrow" aria-hidden="true"></i>
        </div>
        <div class="info-row info-row--danger" onclick="window.location.href='login.html'">
          <i class="ti ti-logout" aria-hidden="true"></i>
          <div class="info-text">
            <span class="info-value info-value--danger">Esci</span>
          </div>
        </div>
      </div>
    </section>

  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item" aria-label="Home">
      <i class="ti ti-home"></i>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item" aria-label="Viaggi">
      <i class="ti ti-car"></i>
      <span>Viaggi</span>
    </a>
    <a href="#" class="nav-item" aria-label="Messaggi">
      <i class="ti ti-message"></i>
      <span>Messaggi</span>
    </a>
    <a href="profilo.html" class="nav-item active" aria-label="Profilo">
      <i class="ti ti-user"></i>
      <span>Profilo</span>
    </a>
  </nav>

</body>
</html>
